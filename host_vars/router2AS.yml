---
enable_ipv6_routing: true

interfaces:
  - name: Loopback0
    ip: 10.47.209.2
    mask: 255.255.255.255

  - name: GigabitEthernet0/0/0
    description: "to ISPS2"
    ip: 10.47.244.2
    mask: 255.255.255.252

  - name: GigabitEthernet0/0/1
    description: "to ASL3SW2"
    ip: 10.47.208.5
    mask: 255.255.255.252

misc_config:
  - description: "Hostname and system settings"
    lines:
      - "hostname R2AS"
      - "no aaa new-model"
      - "subscriber templating"
      - "multilink bundle-name authenticated"
      - "diagnostic bootup level minimal"
      - "spanning-tree extend system-id"

  - description: "Management VRF"
    parents:
      - "vrf definition Mgmt-intf"
      - "address-family ipv4"
    lines: []

  - description: "Management VRF IPv6 address family"
    parents:
      - "vrf definition Mgmt-intf"
      - "address-family ipv6"
    lines: []

  - description: "Redundancy"
    parents:
      - "redundancy"
    lines:
      - "mode none"

  - description: "GigabitEthernet0/0/2"
    parents:
      - "interface GigabitEthernet0/0/2"
    lines:
      - "no ip address"
      - "shutdown"
      - "negotiation auto"

  - description: "Serial0/1/0"
    parents:
      - "interface Serial0/1/0"
    lines:
      - "no ip address"
      - "shutdown"

  - description: "Serial0/1/1"
    parents:
      - "interface Serial0/1/1"
    lines:
      - "no ip address"
      - "shutdown"

  - description: "Management interface"
    parents:
      - "interface GigabitEthernet0"
    lines:
      - "vrf forwarding Mgmt-intf"
      - "no ip address"
      - "shutdown"
      - "negotiation auto"

  - description: "EIGRP address family"
    parents:
      - "router eigrp KevOpsAS"
      - "address-family ipv4 unicast autonomous-system 65515"
    lines:
      - "network 10.47.208.4 0.0.0.3"
      - "network 10.47.209.2 0.0.0.0"
      - "eigrp router-id 10.47.209.2"

  - description: "EIGRP default interface settings"
    parents:
      - "router eigrp KevOpsAS"
      - "address-family ipv4 unicast autonomous-system 65515"
      - "af-interface default"
    lines:
      - "passive-interface"

  - description: "EIGRP active interface GigabitEthernet0/0/1"
    parents:
      - "router eigrp KevOpsAS"
      - "address-family ipv4 unicast autonomous-system 65515"
      - "af-interface GigabitEthernet0/0/1"
    lines:
      - "no passive-interface"

  - description: "EIGRP topology"
    parents:
      - "router eigrp KevOpsAS"
      - "address-family ipv4 unicast autonomous-system 65515"
      - "topology base"
    lines:
      - "redistribute bgp 65515 route-map BGP-EIGRP"

  - description: "BGP base"
    parents:
      - "router bgp 65515"
    lines:
      - "bgp router-id 10.47.209.2"
      - "bgp log-neighbor-changes"
      - "neighbor 10.47.244.1 remote-as 64512"

  - description: "BGP IPv4 address family"
    parents:
      - "router bgp 65515"
      - "address-family ipv4"
    lines:
      - "network 1.1.1.0 mask 255.255.255.0"
      - "network 10.47.209.2 mask 255.255.255.255"
      - "aggregate-address 10.47.192.0 255.255.224.0 summary-only"
      - "redistribute eigrp 65515 route-map EIGRP-BGP"
      - "neighbor 10.47.244.1 activate"

  - description: "BGP IPv6 address family"
    parents:
      - "router bgp 65515"
      - "address-family ipv6"
    lines: []

  - description: "IPv6 routing and HTTP services"
    lines:
      - "ipv6 unicast-routing"
      - "ip forward-protocol nd"
      - "ip http server"
      - "ip http authentication local"
      - "ip http secure-server"
      - "ip tftp source-interface GigabitEthernet0"

  - description: "Prefix-lists"
    lines:
      - "ip prefix-list AS_BLOCK seq 5 permit 10.47.192.0/19 ge 23 le 24"
      - "ip prefix-list AS_INBOUND seq 5 permit 10.47.64.0/19 le 32"
      - "ip prefix-list AS_INBOUND seq 10 permit 10.47.128.0/19 le 32"
      - "ip prefix-list AS_INBOUND seq 15 permit 0.0.0.0/0"

  - description: "Route-map EIGRP-BGP"
    parents:
      - "route-map EIGRP-BGP permit 10"
    lines:
      - "match ip address prefix-list AS_BLOCK"

  - description: "Route-map BGP-EIGRP"
    parents:
      - "route-map BGP-EIGRP permit 10"
    lines:
      - "match ip address prefix-list AS_INBOUND"
      - "set metric 100000 100 255 1 1500"

  - description: "Console line"
    parents:
      - "line con 0"
    lines:
      - "transport input none"
      - "stopbits 1"

  - description: "Auxiliary line"
    parents:
      - "line aux 0"
    lines:
      - "stopbits 1"

  - description: "VTY lines"
    parents:
      - "line vty 0 4"
    lines:
      - "login"