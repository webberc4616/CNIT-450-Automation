enable_ipv6_routing: true
 
interfaces:
  - name: GigabitEthernet0/0/0
    description: "to ISPS3"
    ip: 10.47.180.2
    mask: 255.255.255.252
  - name: GigabitEthernet0/0/1
    description: "to L3S2"
    ip: 10.47.144.5
    mask: 255.255.255.252
  - name: Loopback0
    description: "Router-ID / BGP network"
    ip: 10.47.145.2
    mask: 255.255.255.255
 
misc_config:
  - description: "Hostname and routing"
    lines:
      - "hostname R2EU"
      - "ip routing"
  - description: "Prefix-lists"
    lines:
      - "ip prefix-list EU_BLOCK permit 10.47.128.0/19 ge 23 le 24"
      - "ip prefix-list EU_INBOUND seq 5 permit 10.47.64.0/19 le 32"
      - "ip prefix-list EU_INBOUND seq 10 permit 10.47.192.0/19 le 32"
      - "ip prefix-list EU_INBOUND seq 15 permit 0.0.0.0/0"
  - description: "Route-map EIGRP-BGP"
    parents: ["route-map EIGRP-BGP permit 10"]
    lines:
      - "match ip address prefix-list EU_BLOCK"
  - description: "Route-map BGP-EIGRP"
    parents: ["route-map BGP-EIGRP permit 10"]
    lines:
      - "match ip address prefix-list EU_INBOUND"
      - "set metric 100000 100 255 1 1500"
  - description: "BGP base"
    parents: ["router bgp 65512"]
    lines:
      - "bgp router-id 10.47.145.2"
      - "neighbor 10.47.180.1 remote-as 64512"
  - description: "BGP IPv4 AF"
    parents: ["router bgp 65512", "address-family ipv4 unicast"]
    lines:
      - "neighbor 10.47.180.1 activate"
      - "network 10.47.145.2 mask 255.255.255.255"
      - "aggregate-address 10.47.128.0 255.255.224.0 summary-only"
      - "redistribute eigrp 65512 route-map EIGRP-BGP"
  - description: "EIGRP AF base"
    parents: ["router eigrp KevOpsEU", "address-family ipv4 unicast autonomous-system 65512"]
    lines:
      - "eigrp router-id 10.47.145.2"
      - "network 10.47.144.4 0.0.0.3"
      - "network 10.47.145.2 0.0.0.0"
  - description: "EIGRP default af-interface passive"
    parents: ["router eigrp KevOpsEU", "address-family ipv4 unicast autonomous-system 65512", "af-interface default"]
    lines:
      - "passive-interface"
  - description: "EIGRP active interface GigabitEthernet0/0/1"
    parents: ["router eigrp KevOpsEU", "address-family ipv4 unicast autonomous-system 65512", "af-interface GigabitEthernet0/0/1"]
    lines:
      - "no passive-interface"
  - description: "EIGRP topology base"
    parents: ["router eigrp KevOpsEU", "address-family ipv4 unicast autonomous-system 65512", "topology base"]
    lines:
      - "redistribute bgp 65512 route-map BGP-EIGRP"