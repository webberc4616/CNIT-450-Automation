---
enable_ipv6_routing: true

interfaces:
  - name: GigabitEthernet1/0/1
    description: "to ISP1"
    no_switchport: true
    ip: 10.47.16.14
    mask: 255.255.255.252
  - name: GigabitEthernet1/0/2
    description: "to ISP3"
    ip: 10.47.16.10
    mask: 255.255.255.252
    no_switchport: true
  - name: GigabitEthernet1/0/3
    description: "to ISP4"
    no_switchport: true
    ip: 10.47.16.21
    mask: 255.255.255.252
  - name: GigabitEthernet1/0/5
    description: "to NAR1"
    ip: 10.47.116.5
    mask: 255.255.255.252
    no_switchport: true
  - name: GigabitEthernet1/0/6
    description: "to ASR2"
    no_switchport: true
    ip: 10.47.244.1
    mask: 255.255.255.252
  - name: Lo0
    description: "Loopback Interface"
    ip: 10.47.17.2
    mask: 255.255.255.255


misc_config:
  - description: "Hostname and routing"
    lines:
      - "hostname S2ISP"
      - "ip routing"
  - description: "Configure OSPFv3 process"
    parents: ["router ospfv3 64512"]
    lines:
      - "router-id 10.47.17.2"
  - description: "Configure OSPFv3 IPv4 address family"
    parents: ["router ospfv3 64512", "address-family ipv4 unicast"]
    lines:
      - "passive-interface Loopback0"
  - description: "Configure OSPFv3 on Interfaces"
    parents: ["interface GigabitEthernet1/0/2-4"]
    lines:
      - "ipv6 enable"
      - "ospfv3 network point-to-point"
      - "ospfv3 64512 ipv4 area 0"
      - "ospfv3 64512 ipv6 area 0"
  - description: "Configure OSPFv3 on Loopback Interface"
    parents: ["interface Loopback0"]
    lines:
      - "ipv6 enable"
      - "ospfv3 network point-to-point"
      - "ospfv3 64512 ipv4 area 0"
      - "ospfv3 64512 ipv6 area 0"
  - description: "Configure BGP process and neighbors"
    parents: ["router bgp 64512"]
    lines:
      - "bgp router-id 10.47.17.2"
      - "neighbor 10.47.17.1 description to ISP 1"
      - "neighbor 10.47.17.1 remote-as 64512"
      - "neighbor 10.47.17.1 update-source Loopback0"
      - "neighbor 10.47.17.1 next-hop-self"
      - "neighbor 10.47.17.3 description to ISP 3"
      - "neighbor 10.47.17.3 remote-as 64512"
      - "neighbor 10.47.17.3 update-source Loopback0"
      - "neighbor 10.47.17.3 next-hop-self"
      - "neighbor 10.47.17.4 description to ISP 4"
      - "neighbor 10.47.17.4 remote-as 64512"
      - "neighbor 10.47.17.4 update-source Loopback0"
      - "neighbor 10.47.17.4 next-hop-self"
      - "neighbor 10.47.244.2 description to ASR1"
      - "neighbor 10.47.244.2 remote-as 65515"
      - "neighbor 10.47.244.2 next-hop-self"
      - "neighbor 10.47.244.2 default-originate"
      - "neighbor 10.47.116.6 description to NAR2"
      - "neighbor 10.47.116.6 remote-as 65510"
      - "neighbor 10.47.116.6 next-hop-self"
      - "neighbor 10.47.116.6 default-originate"
      - "neighbor 10.47.116.6 as-override"
  - description: "Configure BGP IPv4 unicast"
    parents: ["router bgp 64512", "address-family ipv4 unicast"]
    lines:
      - "neighbor 10.47.17.2 activate"
      - "neighbor 10.47.17.2 next-hop-self"
      - "neighbor 10.47.17.3 activate"
      - "neighbor 10.47.17.3 next-hop-self"
      - "neighbor 10.47.17.4 activate"
      - "neighbor 10.47.17.4 next-hop-self"
      - "neighbor 10.47.116.2 activate"
      - "neighbor 10.47.116.2 next-hop-self"
      - "neighbor 10.47.116.2 default-originate"
      - "neighbor 10.47.16.26 activate"
      - "neighbor 10.47.16.26 next-hop-self"
      - "neighbor 10.47.16.26 default-originate"
      - "network 10.47.16.0 mask 255.255.254.0"
  - description: "Configure SNMP community"
    lines:
      - "snmp-server community KEVTECHOPS69ISPZBX RO"
  - description: "configure MPLS LDP"
    lines:
      - "mpls label protocol ldp"
      - "mpls ldp router-id Loopback0 force"
      - "mpls ldp allocate global host-routes"
  - description: "Configure MPLS LDP on Interfaces"
    parents: ["interface GigabitEthernet1/0/1-3"]
    lines:
      - "mpls mtu override 1508"
      - "mpls ip"