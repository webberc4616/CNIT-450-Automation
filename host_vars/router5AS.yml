enable_ipv6_routing: true
 
interfaces:
  - name: GigabitEthernet0/0/0
    description: "to R4AS"
    ip: 10.47.240.18
    mask: 255.255.255.252
  - name: Tunnel0
    ip: 10.47.242.2
    mask: 255.255.255.252
    tunnel_source: GigabitEthernet0/0/0
    tunnel_destination: 10.47.240.17
    tunnel_protection: ipsec profile GRE-IPSEC-PROFILE
  - name: GigabitEthernet0/1.10
    description: "VLAN 10 subinterface"
    vlan: 10
  - name: GigabitEthernet0/1.20
    description: "VLAN 20 subinterface"
    vlan: 20
  - name: GigabitEthernet0/1.30
    description: "VLAN 30 subinterface"
    vlan: 30
  - name: GigabitEthernet0/1.40
    description: "VLAN 40 subinterface"
    vlan: 40
  - name: GigabitEthernet0/1.50
    description: "VLAN 50 subinterface"
    vlan: 50
  - name: GigabitEthernet0/1.60
    description: "VLAN 60 subinterface"
    vlan: 60
  - name: GigabitEthernet0/1.70
    description: "VLAN 70 subinterface"
    vlan: 70
  - name: GigabitEthernet0/1.80
    description: "VLAN 80 subinterface"
    vlan: 80
  - name: lo0
    description: "Loopback interface"
    ip: 10.47.209.6
    mask: 255.255.255.255
 
misc_config:
  - description: "Hostname and routing"
    lines:
      - "hostname R5AS"
      - "ip routing"
  - description: "Configure ISAKMP policy"
    parents: ["crypto isakmp policy 10"]
    lines:
      - " encr aes"
      - " hash sha256"
      - " authentication pre-share"
      - " group 14"
  - description: "Configure IPsec transform set"
    parents: ["crypto ipsec transform-set GRE-IPSEC esp-aes esp-sha256-hmac"]
    lines:
      - " mode transport"
  - description: "Configure IPsec profile"
    parents: ["crypto ipsec profile GRE-IPSEC-PROFILE"]
    lines:
      - " set transform-set GRE-IPSEC"
  - description: "Confgiure ISAKMP pre shared key"
    lines:
      - "crypto isakmp key kevtechops address 10.47.240.17"
  - description: "EIGRP AF base"
    parents: ["router eigrp KevOpsAS", "address-family ipv4 unicast autonomous-system 65515"]
    lines:
      - "eigrp router-id 10.47.209.6"
      - "network 10.47.240.16 0.0.0.3"
      - "network 10.47.242.0 0.0.0.3"
      - "network 10.47.224.0 0.0.0.31"
      - "network 10.47.226.0 0.0.0.31"
      - "network 10.47.228.0 0.0.0.31"
      - "network 10.47.230.0 0.0.0.31"
      - "network 10.47.232.0 0.0.0.31"
      - "network 10.47.234.0 0.0.0.31"
      - "network 10.47.236.0 0.0.0.31"
      - "network 10.47.238.0 0.0.0.31"
      - "network 10.47.209.6 0.0.0.0"

  - description: "EIGRP default af-interface passive"
    parents: ["router eigrp KevOpsAS", "address-family ipv4 unicast autonomous-system 65515", "af-interface default"]
    lines:
      - "passive-interface"
  - description: "EIGRP active interface GigabitEthernet0/0/0"
    parents: ["router eigrp KevOpsAS", "address-family ipv4 unicast autonomous-system 65515", "af-interface GigabitEthernet0/0/0"]
    lines:
      - "no passive-interface"
  - description: "EIGRP active interface Tunnel0"
    parents: ["router eigrp KevOpsAS", "address-family ipv4 unicast autonomous-system 65515", "af-interface Tunnel0"]
    lines:
      - "no passive-interface"
  - description: "Configure global services"
    lines:
      - "no ip http server"
      - "ip http secure-server"
      - "ip tftp source-interface GigabitEthernet0"
  - description: "Configure auxiliary line"
    parents: ["line aux 0"]
    lines:
      - "stopbits 1"

  - description: "Configure VTY lines"
    parents: ["line vty 0 4"]
    lines:
      - "login"
  - description: "Configure WSMA agents"
    lines:
      - "wsma agent exec"
      - "wsma agent config"
      - "wsma agent filesys"
      - "wsma agent notify"